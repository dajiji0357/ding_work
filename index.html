<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOW OS 2026 Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <header class="main-header glass">
      <div class="brand-wrap">
        <div class="logo-badge">Ding_work_manager</div>
      </div>

      <div class="header-right">
        <div id="syncStatus" class="status-indicator">SYNCING...</div>
        <div id="loginInfo" class="user-pill">Guest</div>
        <button class="btn btn-outline" onclick="openModal('workerListModal')">작업자 관리</button>
        <button class="btn btn-outline" onclick="openModal('registerModal')">회원가입</button>
        <button id="loginBtn" class="btn btn-outline" onclick="openModal('loginModal')">로그인</button>
        <button id="userLogoutBtn" class="btn btn-outline hidden" onclick="logoutUser()">로그아웃</button>
        <button id="adminBtn" class="btn btn-action" onclick="handleAdminAction()">Admin</button>
        <button id="adminLogoutBtn" class="btn btn-outline hidden" onclick="logoutAdmin()">Admin 로그아웃</button>
      </div>
    </header>
    <div id="networkBanner" class="network-banner hidden"></div>

    <section class="command-center glass">
      <div class="section-head">
        <h2>새 작업 등록</h2>
      </div>
      <input type="text" id="taskName" class="task-input" placeholder="작업 내용을 입력하세요" maxlength="150">
      <div class="input-row">
        <div class="field">
          <label for="taskUserSelect">담당자</label>
          <select id="taskUserSelect"></select>
        </div>
        <div class="field">
          <label for="taskCategorySelect">카테고리</label>
          <select id="taskCategorySelect">
            <option value="진행중">진행중</option>
            <option value="컨펌중">컨펌중</option>
            <option value="수정중">수정중</option>
            <option value="보류중">보류중</option>
            <option value="작업완료">작업완료</option>
          </select>
        </div>
        <div class="field">
          <label for="taskDate">마감일</label>
          <input type="date" id="taskDate">
        </div>
        <button class="btn btn-primary" onclick="addTask()">업무 등록</button>
      </div>
    </section>

    <section class="memo-workspace">
      <div class="section-head">
        <h2>공용 메모 보드</h2>
        <button class="btn btn-primary" onclick="addNewMemo()">새 메모</button>
      </div>
      <div id="memoGrid" class="memo-grid"></div>
    </section>

    <main class="workspace">
      <section class="board glass">
        <div class="col col-progress" id="진행중" ondrop="drop(event)" ondragover="allowDrop(event)">
          <h3>진행중</h3>
          <div id="진행중-list" class="drop-zone"></div>
        </div>
        <div class="col col-confirm" id="컨펌중" ondrop="drop(event)" ondragover="allowDrop(event)">
          <h3>컨펌중</h3>
          <div id="컨펌중-list" class="drop-zone"></div>
        </div>
        <div class="col col-edit" id="수정중" ondrop="drop(event)" ondragover="allowDrop(event)">
          <h3>수정중</h3>
          <div id="수정중-list" class="drop-zone"></div>
        </div>
        <div class="col col-done" id="작업완료" ondrop="drop(event)" ondragover="allowDrop(event)">
          <h3>작업완료</h3>
          <div id="작업완료-list" class="drop-zone"></div>
        </div>
      </section>

      <section class="panel glass shared-note-panel">
        <div class="section-head">
          <h2>전체 공용 메모</h2>
          <div class="note-toolbar">
            <button class="btn btn-outline small" onclick="enterSharedEdit()">편집</button>
            <button class="btn btn-outline small" onclick="insertSharedLink()">링크 추가</button>
          </div>
        </div>
        <div class="note-shell shared-note-shell">
          <textarea id="archiveStaticMemo" class="note-editor note-editor-pane hidden" onblur="exitSharedEdit()" onpaste="handleSharedPaste(event)" placeholder="링크: https://example.com 또는 [제목](https://...)
이미지: Ctrl+V로 붙여넣기"></textarea>
          <div id="sharedView" class="note-view-pane" ondblclick="enterSharedEdit()"></div>
        </div>
      </section>

      <section class="panel glass archive-panel">
        <div class="section-head">
          <h2>작업완료 / 보류중</h2>
        </div>
        <div class="archive-split-board">
          <article class="archive-split-col">
            <div class="archive-col-head">
              <h3>작업완료</h3>
              <a class="btn btn-route done-route" href="completed.html" target="_blank" rel="noopener noreferrer">작업완료</a>
            </div>
            <div id="doneArchiveTaskList" class="archive-grid"></div>
          </article>
          <article class="archive-split-col">
            <div class="archive-col-head">
              <h3>보류중</h3>
              <a class="btn btn-route hold-route-gray" href="hold.html" target="_blank" rel="noopener noreferrer">보류중 작업</a>
            </div>
            <div id="holdArchiveTaskList" class="archive-grid"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <div id="workerListModal" class="modal" onclick="closeOnBackdrop(event, 'workerListModal')">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('workerListModal')">&times;</button>
      <h3>작업자 관리</h3>
      <div id="fullWorkerList" class="worker-list-stack"></div>
    </div>
  </div>

  <div id="registerModal" class="modal" onclick="closeOnBackdrop(event, 'registerModal')">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('registerModal')">&times;</button>
      <h3>회원가입</h3>
      <input type="text" id="regName" placeholder="이름" class="pill-input">
      <input type="password" id="regPw" placeholder="비밀번호" class="pill-input">
      <button class="btn btn-primary full" onclick="registerUser()">가입하기</button>
    </div>
  </div>

  <div id="loginModal" class="modal" onclick="closeOnBackdrop(event, 'loginModal')">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
      <h3>로그인</h3>
      <select id="loginUserSelect" class="pill-input"></select>
      <input type="password" id="loginPw" placeholder="비밀번호" class="pill-input">
      <button class="btn btn-primary full" onclick="loginUser()">로그인</button>
    </div>
  </div>

  <div id="adminModal" class="modal" onclick="closeOnBackdrop(event, 'adminModal')">
    <div class="modal-content wide">
      <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
      <h3>관리자 페이지</h3>
      <div class="admin-section">
        <h4>작업자 정보 전체 수정/삭제</h4>
        <div id="adminUserList" class="admin-list"></div>
      </div>
      <div class="admin-section">
        <h4>작업 정보 전체 수정/삭제</h4>
        <div id="adminTaskList" class="admin-list"></div>
      </div>
    </div>
  </div>

  <div id="taskEditModal" class="modal" onclick="closeOnBackdrop(event, 'taskEditModal')">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('taskEditModal')">&times;</button>
      <h3>작업 수정</h3>
      <input type="text" id="editTaskName" class="pill-input" placeholder="작업명">
      <select id="editTaskUserSelect" class="pill-input"></select>
      <select id="editTaskStatusSelect" class="pill-input">
        <option value="진행중">진행중</option>
        <option value="컨펌중">컨펌중</option>
        <option value="수정중">수정중</option>
        <option value="보류중">보류중</option>
        <option value="작업완료">작업완료</option>
      </select>
      <input type="date" id="editTaskDate" class="pill-input">
      <button class="btn btn-primary full" onclick="saveTaskFromBoard()">저장</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
